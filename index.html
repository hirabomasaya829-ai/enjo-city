<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>炎上市 — デマ消火ゲーム</title>
  <meta name="description" content="遊びながら、デマの延焼を防ぎ、みんなの情報リテラシーを育てる社会貢献型Webゲーム">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game" class="game">
    <canvas id="scene" width="480" height="270"></canvas>
    <div id="signs" class="signs"></div>

    <div id="hud" class="hud">
      <div class="title-badge"><i class="ico flame"></i><span>炎上市</span></div>

      <div class="trend px-box" id="trend">
        <div class="trend-head"><span>いま話題のトピック</span><button class="x" id="trendToggle" aria-label="たたむ">✕</button></div>
        <div class="trend-body" id="trendBody">
          <div class="trend-top">
            <div class="row1"><i class="ico crown"></i><b id="tTopName">#〇〇の発言</b><span id="tTopTag" class="tag fire">炎上中<i class="ico flame"></i></span></div>
            <div class="row2">投稿数　<b id="tTopCount">0</b> <span id="tTopPct" class="pct">(↑+0%)</span></div>
            <div class="chart">
              <span class="ymax" id="yMax">0</span><span class="ymin" id="yMin">0</span>
              <canvas id="spark" width="240" height="56"></canvas>
            </div>
          </div>
          <div class="trend-rows" id="tRows"></div>
        </div>
      </div>

      <div class="town-label">街のようす <small>‹リアルタイム›</small></div>
      <div class="status px-box dark" id="status">
        <div class="hearts" id="hearts"></div>
        <div class="srow"><span id="waveName">待機中</span><span>SCORE <b id="score">0</b></span></div>
        <div class="srow"><span><i class="ico shield"></i> 防火壁 ×<b id="wallCount">0</b></span><button class="mini" id="pauseBtn">Ⅱ</button></div>
      </div>

      <div class="bubble heat" id="heat">
        <div class="bt">炎上度 <span class="flames" id="heatIcons"></span></div>
        <div class="bar red"><i id="heatBar"></i></div>
      </div>
      <div class="bubble cool" id="cool">
        <div class="bt"><i class="ico drop"></i> 鎮火中… <b id="coolPct">0%</b></div>
        <div class="bar blue"><i id="coolBar"></i></div>
      </div>

      <div class="announcer px-box dark" id="announcer">
        <canvas id="mascot" width="32" height="32"></canvas>
        <div class="msg"><i class="ico flame"></i><span id="annText">話題が急増！　消防隊が出動しました！</span></div>
      </div>

      <div class="actions" id="actions">
        <button class="act" id="btnInvestigate"><i class="ico search"></i><span>火元調査</span><kbd>E</kbd></button>
        <button class="act" id="btnWall"><i class="ico shield"></i><span>防火壁</span><kbd>F</kbd></button>
      </div>

      <div class="start-dock" id="startDock">
        <button class="big-btn" id="startBtn">▶ 出動する！</button>
        <button class="sub-btn" id="howBtn">？ 遊び方</button>
      </div>

      <div class="wave-banner" id="waveBanner"></div>
      <div class="toast" id="toast"></div>
    </div>

    <div id="overlay" class="overlay"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
